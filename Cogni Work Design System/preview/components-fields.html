<!doctype html>
<!-- @dsCard group="Brand" name="Components · Form fields" subtitle="Default · focus (chartreuse ring) · disabled · error" viewport="700x240" --><html><head><meta charset="utf-8"><title>Form fields</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:600px}.f label{display:block;font-size:12px;font-weight:600;color:#111;margin-bottom:6px}.f input,.f textarea{width:100%;padding:10px 14px;border-radius:8px;border:1.5px solid #E0E0DC;font-size:14px;font-family:inherit;background:#fff;box-sizing:border-box;outline:none}.f.focus input{border-color:#C8E62E;box-shadow:0 0 0 3px rgba(200,230,46,.15)}.f.err input{border-color:#D32F2F}.f .hint{font-size:12px;color:#D32F2F;margin-top:4px;font-family:var(--font-mono)}</style></head><body>
<div class="grid">
<div class="f"><label>Name</label><input value="Stephan de Haas"/></div>
<div class="f focus"><label>Email — focus</label><input value="stephan@cogni-work.ai"/></div>
<div class="f"><label>Disabled</label><input value="Read only" disabled style="background:#F2F2EE;color:#6B7280"/></div>
<div class="f err"><label>Error</label><input value="invalid@"/><div class="hint">Not a valid email</div></div>
</div>
</body></html>
