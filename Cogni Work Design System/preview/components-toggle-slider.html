<!doctype html>
<!-- @dsCard group="Brand" name="Components · Toggle & slider" subtitle="On/off toggle, chartreuse fill slider" viewport="700x160" --><html><head><meta charset="utf-8"><title>Toggle + Slider</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:32px;background:#fff;font-family:var(--font-sans);display:flex;gap:40px;align-items:center;flex-wrap:wrap}.lab{font-size:13px;color:#6B7280}.tog{width:44px;height:24px;border-radius:12px;background:#C8E62E;position:relative}.tog .k{width:18px;height:18px;border-radius:9px;background:#fff;position:absolute;top:3px;left:23px;box-shadow:0 1px 3px rgba(0,0,0,.2)}.tog.off{background:#E0E0DC}.tog.off .k{left:3px}
.sl{width:260px;position:relative;height:6px;background:#E0E0DC;border-radius:3px}.sl .fill{height:100%;width:65%;background:#C8E62E;border-radius:3px}.sl .thumb{position:absolute;left:calc(65% - 8px);top:-5px;width:16px;height:16px;border-radius:8px;background:#C8E62E;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.val{font-family:var(--font-mono);font-size:12px;color:#C8E62E;margin-left:10px}</style></head><body>
<div style="display:flex;gap:24px;align-items:center"><span class="lab">Toggle · on</span><div class="tog"><div class="k"></div></div><span class="lab">off</span><div class="tog off"><div class="k"></div></div></div>
<div style="display:flex;gap:10px;align-items:center"><span class="lab">Slider</span><div class="sl"><div class="fill"></div><div class="thumb"></div></div><span class="val">65%</span></div>
</body></html>
