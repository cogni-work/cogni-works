<!doctype html>
<!-- @dsCard group="Brand" name="Colors · Accent on dark" subtitle="How chartreuse sits on #111 — the signature moment" viewport="700x240" --><html><head><meta charset="utf-8"><title>Accent on dark</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:32px;background:#111;color:#fff;font-family:var(--font-sans)}
  .wrap{display:flex;align-items:center;gap:24px}
  .chunk{display:flex;align-items:center;gap:14px}
  .swatch{width:84px;height:84px;border-radius:12px}
  h2{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px}
  .eye{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#C8E62E;font-weight:600}
  p{font-size:14px;color:rgba(255,255,255,.65);max-width:340px;margin:8px 0 0;line-height:1.55}
  .bar{height:6px;width:100%;background:rgba(255,255,255,.08);border-radius:3px;margin-top:14px}
  .bar>div{height:100%;border-radius:3px;background:#C8E62E}
</style></head><body>
<div class="wrap">
  <div class="chunk">
    <div class="swatch" style="background:#C8E62E"></div>
    <div>
      <div class="eye">VENUSTAS</div>
      <h2>Chartreuse <span style="color:#C8E62E">·</span> the signature</h2>
      <p>CTAs, single-word highlights, key metrics, active states. Never as body text.</p>
      <div class="bar"><div style="width:72%"></div></div>
    </div>
  </div>
</div>
</body></html>
