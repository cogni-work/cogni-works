<!doctype html>
<!-- @dsCard group="Brand" name="Spacing · Shadows" subtitle="Four soft steps — warm-black, low alpha" viewport="700x200" --><html><head><meta charset="utf-8"><title>Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:32px;background:#FAFAF8;font-family:var(--font-sans)}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}.cell{text-align:center}.sq{width:100%;height:80px;background:#fff;border-radius:12px;margin-bottom:12px}.name{font-size:12px;font-weight:600;color:#111;margin-bottom:2px}.lab{font-family:var(--font-mono);font-size:10px;color:#6B7280}</style></head><body>
<div class="row">
<div class="cell"><div class="sq" style="box-shadow:0 1px 3px rgba(0,0,0,.04),0 1px 2px rgba(0,0,0,.06)"></div><div class="name">sm</div><div class="lab">cards default</div></div>
<div class="cell"><div class="sq" style="box-shadow:0 4px 16px rgba(0,0,0,.06),0 1px 4px rgba(0,0,0,.04)"></div><div class="name">md</div><div class="lab">panels, hover</div></div>
<div class="cell"><div class="sq" style="box-shadow:0 12px 40px rgba(0,0,0,.1),0 4px 12px rgba(0,0,0,.05)"></div><div class="name">lg</div><div class="lab">modals, popovers</div></div>
<div class="cell"><div class="sq" style="box-shadow:0 24px 64px rgba(0,0,0,.14),0 8px 20px rgba(0,0,0,.06)"></div><div class="name">xl</div><div class="lab">overlays</div></div>
</div>
</body></html>
