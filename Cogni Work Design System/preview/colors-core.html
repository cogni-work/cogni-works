<!doctype html>
<!-- @dsCard group="Brand" name="Colors · Core" subtitle="Near-black, chartreuse accent trio, warm neutrals" viewport="700x280" --><html><head><meta charset="utf-8"><title>Colors — Primary</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .sw{border:1px solid var(--cw-border);border-radius:10px;overflow:hidden;background:#fff}
  .sw .chip{height:72px}
  .sw .meta{padding:10px 12px}
  .sw .name{font-size:12px;font-weight:600;color:var(--cw-text)}
  .sw .hex{font-family:var(--font-mono);font-size:11px;color:var(--cw-text-muted);margin-top:2px}
  .sw.on-dark .chip{border-bottom:1px solid rgba(255,255,255,0.08)}
</style></head><body>
<div class="grid">
  <div class="sw on-dark"><div class="chip" style="background:#111"></div><div class="meta"><div class="name">Primary</div><div class="hex">#111111</div></div></div>
  <div class="sw on-dark"><div class="chip" style="background:#333"></div><div class="meta"><div class="name">Secondary</div><div class="hex">#333333</div></div></div>
  <div class="sw"><div class="chip" style="background:#C8E62E"></div><div class="meta"><div class="name">Accent</div><div class="hex">#C8E62E</div></div></div>
  <div class="sw"><div class="chip" style="background:#A8C424"></div><div class="meta"><div class="name">Accent Muted</div><div class="hex">#A8C424</div></div></div>
  <div class="sw"><div class="chip" style="background:#8BA31E"></div><div class="meta"><div class="name">Accent Dark</div><div class="hex">#8BA31E</div></div></div>
  <div class="sw"><div class="chip" style="background:#FAFAF8"></div><div class="meta"><div class="name">Background</div><div class="hex">#FAFAF8</div></div></div>
  <div class="sw"><div class="chip" style="background:#F2F2EE"></div><div class="meta"><div class="name">Surface</div><div class="hex">#F2F2EE</div></div></div>
  <div class="sw"><div class="chip" style="background:#E0E0DC"></div><div class="meta"><div class="name">Border</div><div class="hex">#E0E0DC</div></div></div>
</div>
</body></html>
