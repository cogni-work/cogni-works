<!doctype html>
<!-- @dsCard group="Brand" name="Brand · Iconography" subtitle="Deck solid silhouettes + UI Lucide strokes" viewport="700x300" --><html><head><meta charset="utf-8"><title>Icons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:28px;background:#fff;font-family:var(--font-sans)}.row{display:flex;gap:26px;align-items:flex-start;margin-bottom:14px}.cell{text-align:center}.tile{width:72px;height:72px;border-radius:12px;background:#F2F2EE;display:flex;align-items:center;justify-content:center;margin-bottom:8px}.tile.dark{background:#111}.lab{font-size:11px;color:#6B7280;font-family:var(--font-mono)}svg{stroke:#111;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tile.dark svg{stroke:#C8E62E}.head{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#6B7280;font-weight:600;margin-bottom:12px}</style></head><body>
<div class="head">Deck style · solid silhouettes (PNG)</div>
<div class="row">
<div class="cell"><div class="tile"><img src="../assets/icons/deck/clock.png" width="36"></div><div class="lab">clock</div></div>
<div class="cell"><div class="tile"><img src="../assets/icons/deck/lightbulb.png" width="36"></div><div class="lab">bulb</div></div>
<div class="cell"><div class="tile"><img src="../assets/icons/deck/trend.png" width="36"></div><div class="lab">trend</div></div>
<div class="cell"><div class="tile"><img src="../assets/icons/deck/arrow.png" width="36"></div><div class="lab">arrow</div></div>
</div>
<div class="head">UI style · Lucide stroke 2</div>
<div class="row">
<div class="cell"><div class="tile"><svg width="28" height="28" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div><div class="lab">zap</div></div>
<div class="cell"><div class="tile"><svg width="28" height="28" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div><div class="lab">check</div></div>
<div class="cell"><div class="tile"><svg width="28" height="28" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></div><div class="lab">arrow-r</div></div>
<div class="cell"><div class="tile dark"><svg width="28" height="28" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg></div><div class="lab">menu · dark</div></div>
</div>
</body></html>
